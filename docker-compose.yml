name: dtc245200493_de7_blogcms

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits: { cpus: '1.0', memory: 512M }

services:
  # ---------- Gateway ----------
  nginx:
    <<: *common
    image: nginx:1.25-alpine
    container_name: nginx
    ports: ["8080:80", "8443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: [blog-app]
    networks: [frontend_net, monitoring_net]

  # ---------- Ung dung ----------
  blog-app:
    <<: *common
    build: ./app
    container_name: blog-app
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [frontend_net, backend_net, monitoring_net]

  mysql:
    <<: *common
    image: mysql:8.0
    container_name: mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
    networks: [backend_net]

  phpmyadmin:
    <<: *common
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports: ["8088:80"]
    depends_on:
      mysql: { condition: service_healthy }
    networks: [frontend_net, backend_net]

  # ---------- Giam sat ----------
  prometheus:
    <<: *common
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring_net]

  grafana:
    <<: *common
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports: ["3002:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]
    networks: [monitoring_net]

  loki:
    <<: *common
    image: grafana/loki:2.9.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    ports: ["3100:3100"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [monitoring_net]

  promtail:
    <<: *common
    image: grafana/promtail:2.9.0
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on: [loki]
    networks: [monitoring_net]

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring_net]

  mysqld-exporter:
    <<: *common
    image: prom/mysqld-exporter:v0.15.0
    container_name: mysqld-exporter
    command: --config.my-cnf=/etc/.my.cnf
    volumes:
      - ./mysql/.my.cnf:/etc/.my.cnf:ro
    depends_on:
      mysql: { condition: service_healthy }
    networks: [backend_net, monitoring_net]

  nginx-exporter:
    <<: *common
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: nginx-exporter
    command: -nginx.scrape-uri=http://nginx:80/nginx_status
    depends_on: [nginx]
    networks: [frontend_net, monitoring_net]

networks:
  frontend_net:
  backend_net:
    internal: true
  monitoring_net:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:
